<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<title>Радар бань · ЕБЛ</title>
<!-- Радар для просмотра (01.11, Леха): все найденные бани списком и на карте по категориям, без входа и без действий.
     Открывается по секретной ссылке ebl.su/<ключ> — scripts/deploy.sh кладёт эту страницу под путём из ~/.config/ebl/keys
     (RADAR_VIEW_PATH); ключ — последняя часть адреса, данные отдаёт radar_view только с верным ключом. В тестах — radar.html#<ключ> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@800&display=swap">
<link rel="stylesheet" href="vendor/leaflet.min.css">
<style>
:root{--bg:#f2f4ef;--panel:#fff;--line:#e3e8e0;--ink:#17211b;--ink2:#5d6b62;--ink3:#8b968f;--oak:#3f6b35;--shadow:0 2px 10px rgba(20,40,25,.14);
  --c-pub:#2f7d4a;--c-maybe:#e3a332;--c-spa:#3a78b5;--c-league:#7a5bd6;--c-rent:#a4673a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Golos Text",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
#map{position:fixed;inset:0}
.leaflet-container{background:#eef1ea;font-family:inherit}
.top{position:fixed;z-index:500;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 0 0;pointer-events:none}
.brand{display:inline-flex;align-items:center;gap:8px;margin-left:12px;background:var(--panel);border-radius:999px;padding:6px 14px 6px 6px;box-shadow:var(--shadow);pointer-events:auto;font:800 14px Unbounded,sans-serif;text-decoration:none}
.brand i{width:24px;height:24px;border-radius:50%;background:var(--oak);display:grid;place-items:center;color:#fff;font:700 12px "Golos Text";font-style:normal}
.brand small{font:500 13px "Golos Text";color:var(--ink3)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 10px;scrollbar-width:none;pointer-events:auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;background:var(--panel);font-weight:600;font-size:13px;box-shadow:var(--shadow)}
.chip b{font-weight:500;color:var(--ink3)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=false]{background:rgba(255,255,255,.72);color:var(--ink3)}
.chip[aria-pressed=false] .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.sheet{position:fixed;z-index:600;left:0;right:0;bottom:0;height:var(--h,42%);background:var(--panel);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(20,40,25,.16);display:flex;flex-direction:column;transition:height .22s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet.drag{transition:none}
.grab{flex:none;height:22px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--line)}
#pane{flex:1;min-height:0;display:flex;flex-direction:column}
.head{flex:none;display:flex;align-items:baseline;gap:10px;padding:0 16px 8px;touch-action:none}
.head b{font-size:15px;white-space:nowrap}.head span{color:var(--ink3);font-size:13px}
.search{flex:none;margin:0 12px 6px;position:relative}
.search input{width:100%;height:42px;border-radius:12px;border:0;background:var(--bg);padding:0 38px 0 14px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.search input:focus{box-shadow:inset 0 0 0 2px var(--line)}
.search button{position:absolute;right:4px;top:4px;width:34px;height:34px;border-radius:10px;color:var(--ink3);font-size:18px}
.list{flex:1;overflow:auto;padding:0 6px 12px;overscroll-behavior:contain}
.it{width:100%;text-align:left;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 10px;border-radius:12px}
.it:hover{background:var(--bg)}
.it b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{display:block;color:var(--ink3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idx{display:grid;justify-items:end;gap:3px;font-size:12px;color:var(--ink2);min-width:42px}
.bar{display:block;width:42px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--c) var(--w),var(--line) var(--w))}
.more{padding:10px 12px;color:var(--ink3);font-size:13px}
.card{flex:1;overflow:auto;padding:0 18px 18px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.back{align-self:flex-start;color:var(--ink3);font-size:13.5px;padding:2px 0}
.kind{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--c)}
.card h2{font:800 21px/1.15 Unbounded,sans-serif;letter-spacing:-.01em}
.addr{color:var(--ink2);font-size:14px}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2)}
.meter .bar{flex:1;width:auto;height:6px;border-radius:3px}
.note{font-size:14px;line-height:1.45;color:var(--ink)}
.price{font-size:14px;color:var(--ink2)}
.links{display:flex;flex-wrap:wrap;gap:8px;padding-top:2px}
.links a{height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);display:inline-flex;align-items:center;font-weight:600;font-size:14px;text-decoration:none}
.links a.main{border-color:var(--c);color:var(--c)}
#boot{position:fixed;inset:0;z-index:900;display:grid;place-items:center;background:var(--bg);color:var(--ink2);font-size:15px;padding:24px;text-align:center}
.leaflet-control-attribution{font-size:10px}
@media (min-width:900px){
  .top{left:392px}
  .sheet{top:12px;bottom:12px;left:12px;right:auto;width:368px;height:auto;border-radius:22px;padding-top:12px}
  .grab{display:none}
}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <span class="brand"><i>Р</i>Радар бань <small id="total"></small></span>
  <div class="chips" id="chips" role="group" aria-label="Категории"></div>
</div>
<section class="sheet" id="sheet" aria-label="Список бань">
  <div class="grab" id="grab" role="button" aria-label="Развернуть список"></div>
  <div id="pane"></div>
</section>
<div id="boot">Загружаю Радар…</div>
<script src="config.js"></script>
<script src="vendor/leaflet.min.js"></script>
<script src="radar.js"></script>
</body>
</html>
