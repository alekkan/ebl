# API Gateway в Яндекс Облаке: прокси к Supabase (REST, Auth, Storage, Edge Functions).
# Зачем: api Supabase стоит за Cloudflare, а его в России режут мобильные и домашние провайдеры — без VPN сайт висел на
# «Грею парилку…» (28.09.2026). Браузер ходит к Яндексу, Яндекс из дата-центра — к Supabase.
# Обновить: yc serverless api-gateway update --name ebl-api --spec infra/api-gateway.yaml
openapi: 3.0.0
info:
  title: ebl-api
  version: 1.0.0
paths:
  /{path+}:
    x-yc-apigateway-any-method:
      x-yc-apigateway-integration:
        type: http
        url: https://yeerkfdgmhcmvdqzaoio.supabase.co/{path}
        headers:
          '*': '*'
          Host: ''
        omitEmptyHeaders: true
        query:
          '*': '*'
        # connect — короткий нарочно: из Яндекса большая часть попыток соединиться с Cloudflare зависает, и шлюз ждёт таймаут,
        # прежде чем попробовать снова. С 5 с почти каждый запрос шёл 6,5 с, бывало 18 с и 503; с 0,3 с — ~0,35 с (07.10.2026).
        # Хорошее соединение до Cloudflare устанавливается за десятки миллисекунд — запаса хватает.
        timeouts:
          connect: 0.3
          read: 30
      parameters:
        - name: path
          in: path
          required: false
          schema:
            type: string
